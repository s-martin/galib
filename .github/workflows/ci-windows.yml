name: CI-Windows

on: [push, pull_request]

env:
  # Path to the CMake build directory.
  build: '${{ github.workspace }}/build'
  config: 'Debug'

jobs:
  build:

    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Download and install Boost
      uses: MarkusJx/install-boost@v2.6.0
      id: install-boost
      with:
          boost_version: 1.81.0
          toolset: msvc 
          platform_version: 2022
          link: shared # or static
          arch: x86 # is also for AMD64
     
    # Usually dont build doc on Windows, is done on Linux job
    #- name: Install Doxygen and Graphviz     
    #  run: choco install doxygen.install graphviz
    - name: Install opencppcoverage
      run: |
        choco install opencppcoverage
        echo "C:\Program Files\OpenCppCoverage" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
  
    - name: Configure CMake
      run: cmake . -DCMAKE_BUILD_TYPE=${{ env.config }} -B ${{ env.build }} -DBUILD_DOC=OFF
      env:
        BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        
    - uses: ammaraskar/msvc-problem-matcher@master
        
    - name: Build CMake
      run: cmake --build ${{ env.build }}
    
    - name: Run unit tests
      env:
        BOOST_LIBDIR: ${{ steps.install-boost.outputs.BOOST_ROOT }}/lib
      run: |
        # the shared Boost DLLs must be found when the test exe is started
        $env:PATH = "$env:BOOST_LIBDIR;$env:PATH"
        cmake --build ${{ env.build }} --config ${{ env.config }} --target GAlibTest
        ctest --test-dir ${{ env.build }} -C ${{ env.config }} --output-on-failure

    - name: Publish test results
      # The default action is a Docker container action, which only runs on Linux
      # runners. Use the composite variant so this step works on windows-latest.
      uses: EnricoMi/publish-unit-test-result-action/composite@v2
      if: always()
      with:
        files: |
          ${{ env.build }}/**/*results.xml

    - name: Run coverage
      env:
        BOOST_LIBDIR: ${{ steps.install-boost.outputs.BOOST_ROOT }}/lib
      run: |
        # the shared Boost DLLs must be found when the test exe is started
        $env:PATH = "$env:BOOST_LIBDIR;$env:PATH"
        cmake --build ${{ env.build }} --config ${{ env.config }} --target GAlibOpencppcoverage
        





